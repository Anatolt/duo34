<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Duo34 — перенос прогресса</title><style>body{max-width:640px;margin:64px auto;padding:24px;background:#16191f;color:#eee;font:18px/1.6 system-ui}button,a{font:inherit}button{padding:12px 20px;cursor:pointer}a{color:#a5d8ff}</style><h1>Перенос прогресса Duo34</h1><p id="status">Для переноса откройте старый адрес в том браузере, где вы проходили истории.</p><button id="save" hidden>Сохранить перенесённый прогресс</button><p><a href="https://de.hohohosting.ru/duo34-progress.html">Забрать прогресс со старого адреса</a></p><p><a href="./">Открыть Duo34</a></p><script type="module">
import {restore} from './engine.js';
const status=document.querySelector('#status'),button=document.querySelector('#save');
const fragment=location.hash.slice(1);history.replaceState(null,'',location.pathname);
try{if(fragment){const payload=JSON.parse(decodeURIComponent(fragment));const parsed=JSON.parse(payload.progress);if(parsed?.version!==1)throw Error('version');const normalized=JSON.stringify(restore(payload.progress));const existing=localStorage.getItem('duo34-v1');status.textContent=existing?'На новом адресе уже есть сохранение. При переносе его резервная копия останется в этом браузере.':'Сохранение готово к переносу.';button.hidden=false;button.onclick=()=>{try{const current=localStorage.getItem('duo34-v1');if(current)localStorage.setItem('duo34-v1-backup-'+Date.now(),current);localStorage.setItem('duo34-v1',normalized);if(['on','off'].includes(payload.sound))localStorage.setItem('duo34-sound',payload.sound);status.textContent='Прогресс перенесён. Можно открыть Duo34.';button.hidden=true;}catch{status.textContent='Не удалось сохранить прогресс. Проверьте разрешения браузера.';}};}}catch{status.textContent='Не удалось прочитать сохранение. Повторите перенос со старого адреса.';}
</script></html>
